[workspace]
resolver = "3"
members = ["crates/opshero-core", "crates/opshero-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/NICE-DEV226/opshero-core"
publish = false # not published to crates.io yet: the crate names must be checked first

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
