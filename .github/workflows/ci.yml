# CI for opshero. Third-party actions are pinned to a commit, not a tag.
# This file has NOT been run on a real runner yet (written 2026-10-21); every command it
# calls is a script or cargo command that was run locally: see docs/roadmap.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPSHERO_REQUIRE_NODE: "1" # a missing `node` must fail the differential test, not skip it
  OPSHERO_REQUIRE_BASH: "1" # same for the shell-analyzer differential test against bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Checks the expected outcome of each TLA+ model (two are meant to be violated).
      - run: scripts/check-formal.sh

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Injects 70 known defects; every one must be caught by a failing test.
      - run: python3 scripts/mutation-check.py
