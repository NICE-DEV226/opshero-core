# Keeps the pinned GitHub Actions and the Cargo dependencies current. Updates arrive as pull
# requests, which run the full CI; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
