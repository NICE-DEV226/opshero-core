# CI for opshero. Third-party actions are pinned to a commit, not a tag.
# First green run on a real runner: 2026-10-22 (ubuntu-24.04: test 61 s, formal 8 s, mutation
# 175 s). Every command it calls is also available locally as scripts/ci-local.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPSHERO_REQUIRE_NODE: "1" # a missing `node` must fail the differential test, not skip it

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, experimental: false, bash_required: "1" }
          # macOS has no `timeout` and an old /bin/bash: the bash differential test skips itself there.
          - { os: macos-latest, experimental: false, bash_required: "" }
          # Windows is not supported yet. This job only reports what breaks; it never fails the build.
          - { os: windows-latest, experimental: true, bash_required: "" }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      OPSHERO_REQUIRE_BASH: ${{ matrix.bash_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Packaging and installer, against a fake local release (not for Windows: no installer there).
      - run: sh scripts/test-install.sh
        if: runner.os != 'Windows'
      # docs/cli.md is generated from the program's own --help: it must be current.
      - run: python3 scripts/gen-cli-docs.py --check
        if: runner.os == 'Linux'

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Licenses (Apache-2.0 compatibility), known vulnerabilities, unexpected sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  fuzz:
    # Coverage-guided fuzzing (libFuzzer, needs nightly) of the parsers that read untrusted input.
    # Each target checks properties, not just "does not crash". 60 s per target on every push is a
    # smoke run; a longer campaign belongs in a scheduled job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 seconds
        run: |
          for target in policy record canon shellcmd; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep the crashing input, if any
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks the expected outcome of each TLA+ model (two are meant to be violated).
      - run: scripts/check-formal.sh

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Injects 87 known defects; every one must be caught by a failing test.
      - run: python3 scripts/mutation-check.py
