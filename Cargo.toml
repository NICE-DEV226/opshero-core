[workspace]
resolver = "3"
members = ["crates/opshero-core", "crates/opshero-cli"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/NICE-DEV226/opshero-core"
publish = false # not published to crates.io yet: the names are free (checked 2026-10-22); publishing is the owner's decision
keywords = ["git", "ci", "verification", "evidence", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
