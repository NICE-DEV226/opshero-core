# Builds the release archives and, for a tag `vX.Y.Z`, publishes them with checksums and a signed
# build-provenance attestation. Run it by hand (workflow_dispatch) to build and inspect the archives
# without publishing anything. Third-party actions are pinned to a commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they do not depend on the glibc of the build machine.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin, musl: false }
          - { os: macos-latest, target: x86_64-apple-darwin, musl: false }
          # Experimental: the test suite passes on Windows in CI, but it has not been tried with a real agent.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, musl: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/opshero"
          if [ "${{ runner.os }}" != "Windows" ]; then file "$BIN"; fi
          if [ "${{ matrix.musl }}" = "true" ]; then
            file "$BIN" | grep -Eq "statically linked|static-pie linked" || { echo "the Linux binary is not static"; exit 1; }
          fi
          # A cross-compiled x86_64 macOS binary may not run on an arm64 runner without Rosetta.
          "$BIN" --version || echo "could not execute the binary here (cross-compiled)"
      - name: Package
        shell: bash
        run: |
          PY=python3; [ "${{ runner.os }}" = "Windows" ] && PY=python
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # The manual page and completions come from the program's own definitions, which do not
          # depend on the platform: a host-native build is used so that cross-compiled targets work too.
          cargo build --locked -q
          $PY scripts/gen_extras.py --bin target/debug/opshero --out extras
          EXE=opshero; [ "${{ runner.os }}" = "Windows" ] && EXE=opshero.exe
          $PY scripts/package_release.py --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/$EXE" --version "$VERSION" --out dist --extras extras
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    # Only for a version tag. A manual run stops after `build` and publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance with the workflow identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: The tag must match the version in Cargo.toml
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"; exit 1; }
          # The action installs the release it was cut with: its default must be this version.
          grep -q "default: \"${VERSION}\"" action.yml || { echo "action.yml does not default to version ${VERSION}"; exit 1; }
      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm ./*.sha256
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --prerelease --title "${GITHUB_REF_NAME}" --notes \
          "Pre-alpha. What works and what does not: docs/status.md. Verify a download with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`. Install: scripts/install.sh."
